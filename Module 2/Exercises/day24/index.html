<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats - Food Ordering & Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Addis Eats</h1>
        <input type="text" id="search" placeholder="Search dishes..." aria-label="Search dishes">
    </header>

    <main class="app-main">
        <section id="menu" aria-label="Menu" class="menu-container"></section>
        
        <aside class="sidebar-aside">
            <div id="cart" aria-label="Your order" class="cart-container">
                <h2>Your Order</h2>
                <ul id="cart-list" class="cart-items"></ul>
                <div class="cart-summary">
                    <p>Total: <strong id="cart-total">0.00</strong> ETB</p>
                </div>
            </div>

            <div class="checkout-container">
                <h2>TeleBirr Checkout</h2>
                <form id="checkout" novalidate>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="Abebe Bikila">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone (TeleBirr)</label>
                        <input type="tel" id="phone" required placeholder="0912345678">
                    </div>

                    <div class="form-group">
                        <label for="area">Delivery Area</label>
                        <select id="area">
                            <option value="Bole">Bole</option>
                            <option value="Kazanchis">Kazanchis</option>
                            <option value="Megenagna">Megenagna</option>
                        </select>
                    </div>

                    <p id="form-error" class="error-msg" aria-live="polite"></p>
                    <button type="submit" class="btn-checkout">Place Order</button>
                </form>
                <div id="confirmation" class="confirmation-box"></div>
            </div>
        </aside>
    </main>

    <footer class="app-footer">
        <p>Bole, Addis Ababa &bull; TeleBirr Accepted</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
