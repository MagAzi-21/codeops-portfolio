<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Facts Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>Country Facts Explorer</h1>
        </header>

        <form id="search-form">
            <input id="country-input" type="text" placeholder="Enter country name..." value="ethiopia" required>
            <button type="submit">Search</button>
        </form>

        <div id="status-message" class="status-msg"></div>
        <div id="facts-card" class="facts-card"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
